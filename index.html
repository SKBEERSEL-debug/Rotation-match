<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#047857"><title>Rotation équitable U10 v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}header{background:linear-gradient(120deg,#047857,#0f766e);color:#fff;padding:22px max(14px,calc((100% - 1180px)/2))}h1{margin:2px 0}header p{margin:4px 0}main{max-width:1180px;margin:auto;padding:14px}nav{display:flex;gap:7px;overflow:auto;margin:8px 0 16px}.btn,button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.on,.primary{background:#047857;color:#fff;border-color:#047857}.danger{color:#be123c}.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px}.player{display:grid;grid-template-columns:25px minmax(110px,1fr) 80px auto auto auto;gap:6px;align-items:center;padding:7px 0;border-top:1px solid #e2e8f0}.off{opacity:.48}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.keeper{background:#fef3c7}.error{color:#be123c;font-weight:700}.info{padding:10px;background:#ecfdf5;color:#065f46;border-radius:9px;font-size:13px}.wide{width:100%;margin-top:10px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}.match{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.timer{text-align:center}.clock{font-size:82px;font-weight:900;font-variant-numeric:tabular-nums}.warn{color:#d97706}.controls{display:flex;gap:8px}.controls .primary{flex:1}.pitch{position:relative;background:#16834b;aspect-ratio:10/7.2;border:4px solid #fff;border-radius:10px;overflow:hidden;margin-top:12px}.half{position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffffcc}.circle{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid #ffffffcc;border-radius:50%;transform:translate(-50%,-50%)}.token{position:absolute;transform:translate(-50%,-50%);text-align:center}.token b{display:flex;width:34px;height:34px;margin:auto;border:2px solid #fff;border-radius:50%;align-items:center;justify-content:center;color:#fff;background:#0f172a;font-size:11px}.token span{display:block;background:#fff;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:800;white-space:nowrap}.change{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #e2e8f0}.next{padding:10px;background:#fef3c7;border-radius:9px}.grounds{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:40px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.pill{padding:9px;border:1px solid #e2e8f0;border-radius:9px}.ok{color:#047857;font-weight:800}@media(max-width:800px){.grid,.match,.grounds{grid-template-columns:1fr}.player{grid-template-columns:22px 1fr 72px auto}.clock{font-size:64px}.card{padding:12px}}
</style></head><body><header><small>GESTION U10 • VERSION 2</small><h1>Rotation équitable</h1><p>60 minutes • 8 séquences de 7 min 30 • 1 ou 2 gardiens</p></header><main><nav id="nav"></nav><div id="app"></div></main><script>
'use strict';
const POS=['GB','DG','DC','DD','M','MG','MD','A'],FIELD=POS.slice(1),XY={GB:[50,89],DG:[18,70],DC:[50,73],DD:[82,70],M:[50,50],MG:[20,42],MD:[80,42],A:[50,18]},BLOCK=450;
const uid=()=>crypto.randomUUID(),blank=()=>({matches:0,minutes:0,positions:Object.fromEntries(POS.map(x=>[x,0]))});
const defaults=()=>Array.from({length:12},(_,i)=>({id:uid(),name:i<10?'Joueur '+(i+1):'Gardien '+(i-9),keeper:i>9,absent:false,guest:false,startPos:i>9?'GB':'AUTO'}));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let players=load('u10-roster',defaults()),history=load('u10-history',{}),matches=load('u10-matches',[]),schedule=load('u10-current',null),tab='effectif',matchName='Nouveau match',idx=0,seconds=BLOCK,running=false,tick=null,endAt=0,warned=false,error='';
const active=()=>players.filter(p=>!p.absent),pick=(a,f)=>[...a].sort((x,y)=>f(x)-f(y)||x.name.localeCompare(y.name,'fr'))[0],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeRotation(){
 const a=active();if(a.length<8)return{error:'Il faut au moins 8 joueurs disponibles.'};if(a.length>12)return{error:'Maximum 12 joueurs présents.'};
 const keep=a.filter(p=>p.keeper);if(keep.length<1||keep.length>2)return{error:'Sélectionnez un ou deux gardiens.'};
 const dup=FIELD.filter(pos=>a.filter(p=>p.startPos===pos).length>1);if(dup.length)return{error:'Poste attribué deux fois : '+dup.join(', ')};
 const g1=keep[0],g2=keep[1]||null,gks=g2?[g1,g1,g1,g1,g2,g2,g2,g2]:[g1,g1,g1,g1,g1,g1,g1,g1];
 const used=Object.fromEntries(a.map(p=>[p.id,0])),last={},rows=[];
 const target=Object.fromEntries(a.map(p=>[p.id,5]));
 let keeperField={};
 if(g2){target[g1.id]=5;target[g2.id]=5;a.filter(p=>!p.keeper).sort((x,y)=>(history[x.id]?.minutes||0)-(history[y.id]?.minutes||0)).slice(0,4).forEach(p=>target[p.id]=6);keeperField={[g1.id]:[5],[g2.id]:[1]};}
 else{target[g1.id]=8;const field=a.filter(p=>!p.keeper);const base=Math.floor(56/field.length),extra=56-base*field.length;field.forEach(p=>target[p.id]=base);field.sort((x,y)=>(history[x.id]?.minutes||0)-(history[y.id]?.minutes||0)).slice(0,extra).forEach(p=>target[p.id]++);}
 for(let b=0;b<8;b++){
  const gk=gks[b],selected=[gk];used[gk.id]++;
  if(g2){const other=keep.find(k=>k.id!==gk.id&&keeperField[k.id]?.includes(b));if(other){selected.push(other);used[other.id]++;}}
  if(b===0)a.filter(p=>!p.keeper&&p.startPos!=='AUTO').forEach(p=>{if(selected.length<8){selected.push(p);used[p.id]++;}});
  while(selected.length<8){const available=a.filter(p=>p.id!==gk.id&&!selected.some(x=>x.id===p.id)),pool=available.filter(p=>used[p.id]<target[p.id]),p=pick(pool.length?pool:available,x=>used[x.id]*100+(history[x.id]?.minutes||0));selected.push(p);used[p.id]++;}
  const assignments={GB:gk},remain=selected.filter(p=>p.id!==gk.id);
  FIELD.forEach(pos=>{const p=remain.find(x=>x.startPos===pos);if(p){assignments[pos]=p;last[p.id]=pos;remain.splice(remain.indexOf(p),1);}});
  FIELD.forEach(pos=>{if(assignments[pos])return;const p=pick(remain,x=>(last[x.id]===pos?-100:0)+(history[x.id]?.positions?.[pos]||0)*5);assignments[pos]=p;last[p.id]=pos;remain.splice(remain.indexOf(p),1);});
  rows.push({block:b+1,start:b*7.5,end:(b+1)*7.5,assignments,bench:a.filter(p=>!selected.some(x=>x.id===p.id))});
 }
 return{schedule:rows};
}
const mt=n=>Number.isInteger(n)?n+':00':Math.floor(n)+':30',clock=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pitch(r){return '<div class="pitch"><div class="half"></div><div class="circle"></div>'+POS.map(pos=>{const[x,y]=XY[pos];return '<div class="token" style="left:'+x+'%;top:'+y+'%"><b>'+pos+'</b><span>'+esc(r.assignments[pos].name)+'</span></div>';}).join('')+'</div>';}
function beep(f=800,d=.2){try{const C=new(window.AudioContext||window.webkitAudioContext)(),o=C.createOscillator(),g=C.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(C.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,C.currentTime+d);o.stop(C.currentTime+d);}catch(e){}}
function reset(n=idx){running=false;clearInterval(tick);idx=n;seconds=BLOCK;warned=false;render();}
function toggle(){beep(440,.08);running=!running;if(running){endAt=Date.now()+seconds*1000;tick=setInterval(()=>{seconds=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(seconds<=60&&!warned){warned=true;beep();navigator.vibrate?.([200,100,200]);}if(seconds===0){running=false;clearInterval(tick);beep(1000,.5);navigator.vibrate?.([500,150,700]);}render();},250);}else clearInterval(tick);render();}
function setTab(x){tab=x;render();}function upd(id,key,val){players=players.map(p=>p.id===id?{...p,[key]:val}:p);save('u10-roster',players);render();}function keeper(id){players=players.map(p=>p.id===id?{...p,keeper:!p.keeper,startPos:!p.keeper?'GB':'AUTO'}:p);save('u10-roster',players);render();}
function generate(){const r=makeRotation();if(r.error){error=r.error;render();return;}error='';schedule=r.schedule;save('u10-current',schedule);idx=0;seconds=BLOCK;tab='rotation';render();}
function validate(){const a=active();a.forEach(p=>{history[p.id]??=blank();history[p.id].matches++;});schedule.forEach(r=>Object.entries(r.assignments).forEach(([pos,p])=>{history[p.id]??=blank();history[p.id].minutes+=7.5;history[p.id].positions[pos]=(history[p.id].positions[pos]||0)+1;}));matches.unshift({id:uid(),name:matchName,date:new Date().toLocaleDateString('fr-BE')});save('u10-history',history);save('u10-matches',matches);tab='match';reset(0);}
function clearAll(){if(!confirm('Supprimer l’effectif, la rotation active et tout l’historique ?'))return;['u10-roster','u10-history','u10-matches','u10-current'].forEach(k=>localStorage.removeItem(k));players=defaults();history={};matches=[];schedule=null;error='';tab='effectif';render();}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({players,history,matches},null,2)],{type:'application/json'}));a.download='rotation-u10-v2.json';a.click();}function restore(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);players=d.players;history=d.history||{};matches=d.matches||[];save('u10-roster',players);save('u10-history',history);save('u10-matches',matches);render();}catch(e){alert('Fichier invalide');}};r.readAsText(f);}
function summary(){if(!schedule)return'';const a=active();return '<div class="card"><h2>Contrôle du temps de jeu</h2><div class="summary">'+a.map(p=>{let gb=0,field=0;schedule.forEach(r=>{const pos=Object.entries(r.assignments).find(([,x])=>x.id===p.id)?.[0];if(pos==='GB')gb++;else if(pos)field++;});const total=(gb+field)*7.5,limit=p.keeper&&a.filter(x=>x.keeper).length===2?37.5:60;return '<div class="pill"><b>'+esc(p.name)+'</b><br>'+total+' min <span class="'+(total<=limit?'ok':'error')+'">'+(total<=limit?'✓':'DÉPASSEMENT')+'</span><br><small>GB '+gb+' • terrain '+field+'</small></div>';}).join('')+'</div></div>';}
function render(){document.getElementById('nav').innerHTML=[['effectif','Effectif'],['rotation','Rotation'],['match','Mode match'],['terrains','Terrains'],['historique','Historique']].map(([id,l])=>'<button class="btn '+(tab===id?'on':'')+'" onclick="setTab(\''+id+'\')">'+l+'</button>').join('');const app=document.getElementById('app');
 if(tab==='effectif'){const kc=active().filter(p=>p.keeper).length;app.innerHTML='<section class="grid"><div class="card"><h2>Joueurs et poste prioritaire</h2><p class="info">Gardiens sélectionnés : <b>'+kc+'</b>. Avec 1 gardien : 60 min au goal. Avec 2 gardiens : maximum 37 min 30 chacun.</p>'+players.map((p,i)=>'<div class="player '+(p.absent?'off':'')+'"><b>'+(i+1)+'</b><input value="'+esc(p.name)+'" onchange="upd(\''+p.id+'\',\'name\',this.value)"><select '+(p.keeper?'disabled':'')+' onchange="upd(\''+p.id+'\',\'startPos\',this.value)"><option value="AUTO">Auto</option>'+FIELD.map(x=>'<option '+(p.startPos===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="'+(p.keeper?'keeper':'')+'" onclick="keeper(\''+p.id+'\')">GB</button><button onclick="upd(\''+p.id+'\',\'absent\','+(!p.absent)+')">'+(p.absent?'Absent':'Présent')+'</button>'+(p.guest?'<button onclick="players=players.filter(x=>x.id!==\''+p.id+'\');save(\'u10-roster\',players);render()">X</button>':'')+'</div>').join('')+'</div><aside><div class="card"><button onclick="players.push({id:uid(),name:\'Invité\',keeper:false,absent:false,guest:true,startPos:\'AUTO\'});save(\'u10-roster\',players);render()">+ Ajouter un remplaçant</button></div><div class="card"><h3>Préparer le match</h3><input value="'+esc(matchName)+'" onchange="matchName=this.value"><p class="error">'+esc(error)+'</p><button class="primary wide" onclick="generate()">Calculer les rotations</button></div><div class="card row"><button onclick="backup()">Exporter</button><label class="btn">Importer<input hidden type="file" onchange="restore(this)"></label><button class="danger" onclick="clearAll()">Réinitialiser les données</button></div></aside></section>';}
 else if(!schedule){app.innerHTML='<div class="card empty"><h2>Aucune rotation active</h2><button onclick="setTab(\'effectif\')">Préparer le match</button></div>';}
 else if(tab==='rotation'){app.innerHTML='<div class="card scroll"><table><thead><tr><th>Temps</th>'+POS.map(x=>'<th>'+x+'</th>').join('')+'<th>Banc</th></tr></thead><tbody>'+schedule.map(r=>'<tr><th>'+mt(r.start)+' à '+mt(r.end)+'</th>'+POS.map(x=>'<td>'+esc(r.assignments[x].name)+'</td>').join('')+'<td>'+r.bench.map(p=>esc(p.name)).join(' • ')+'</td></tr>').join('')+'</tbody></table></div>'+summary()+'<button class="primary" onclick="validate()">Valider et ouvrir le mode match</button>';}
 else if(tab==='match'){const r=schedule[idx],n=schedule[Math.min(7,idx+1)],changes=idx===7?[]:active().map(p=>{const a=Object.entries(r.assignments).find(([,x])=>x.id===p.id)?.[0]||'Banc',b=Object.entries(n.assignments).find(([,x])=>x.id===p.id)?.[0]||'Banc';return a!==b?{p,a,b}:null;}).filter(Boolean);app.innerHTML='<section class="match"><div class="card timer"><small>SÉQUENCE '+(idx+1)+' SUR 8</small><div class="clock '+(seconds<=60?'warn':'')+'">'+clock(seconds)+'</div><p>'+mt(r.start)+' à '+mt(r.end)+'</p><div class="controls"><button class="primary" onclick="toggle()">'+(running?'Pause':'Démarrer')+'</button><button onclick="reset()">↺</button><button '+(idx===7?'disabled':'')+' onclick="reset(Math.min(7,idx+1))">⏭</button></div>'+pitch(r)+'<p><b>Banc actuel :</b> '+r.bench.map(p=>esc(p.name)).join(' • ')+'</p></div><div class="card"><h2>Prochains changements</h2>'+(idx===7?'<p>Dernière séquence.</p>':changes.map(c=>'<div class="change"><b>'+esc(c.p.name)+'</b><span>'+c.a+' → '+c.b+'</span></div>').join('')+'<p class="next"><b>Prochain banc :</b> '+n.bench.map(p=>esc(p.name)).join(' • ')+'</p>')+'</div></section>';}
 else if(tab==='terrains'){app.innerHTML='<section class="grounds">'+schedule.map(r=>'<div class="card"><h3>Séquence '+r.block+' • '+mt(r.start)+' à '+mt(r.end)+'</h3>'+pitch(r)+'<p><b>Banc :</b> '+r.bench.map(p=>esc(p.name)).join(' • ')+'</p></div>').join('')+'</section>';}
 else{app.innerHTML='<section class="grid"><div class="card scroll"><h2>Historique</h2><table><thead><tr><th>Joueur</th><th>Minutes</th>'+POS.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+players.filter(p=>!p.guest).map(p=>{const s=history[p.id]||blank();return'<tr><th>'+esc(p.name)+'</th><td>'+s.minutes+'</td>'+POS.map(x=>'<td>'+(s.positions[x]||0)+'</td>').join('')+'</tr>';}).join('')+'</tbody></table></div><aside class="card"><h2>Matchs enregistrés</h2>'+matches.map(m=>'<p>✓ <b>'+esc(m.name)+'</b><br><small>'+m.date+'</small></p>').join('')+'</aside></section>';}}
render();
</script></body></html>
